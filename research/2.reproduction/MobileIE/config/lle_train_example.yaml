# 训练用配置示例（默认不会被读取，训练前复制为 lle.yaml）
# 注意：训练必须使用多分支网络 -> type: original，且不能用重参数化权重
exp_name: lle_train

train:
  warmup: True
  warmup_epoch: 10
  lr_warmup: 1e-6
  train_inp: ./data/LOLdataset/our485/low
  train_gt: ./data/LOLdataset/our485/high
  valid_inp: ./data/LOLdataset/eval15/low
  valid_gt: ./data/LOLdataset/eval15/high
  batch_size: 4        # 8GB 显存建议 2 或 1
  epoch: 2000
  lr: 1e-3
  num_workers: 0
  save_every: 20
  save_slim: true

test:
  test_inp: ./data/LOLdataset/eval15/low
  test_gt: ./data/LOLdataset/eval15/high
  num_workers: 0
  save: false

demo:
  demo_inp: ./data/samples/lowlight
  num_workers: 0

model:
  type: original
  pretrained: false
  need_slim: false
  rep_scale: 4
  channels: 12
